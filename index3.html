<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Globalume</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .article {
            border-bottom: 1px solid #ccc;
            padding: 20px 0;
        }

        .article img {
            width: 300px;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

    </style>

</head>

<body>

    <h1>Hello Globalume 👋</h1>

    <p id="status">
        Loading news...
    </p>

    <div id="news"></div>


    <script>

        async function getNews() {

            try {

                const response =
                    await fetch("/api/news");

                const data =
                    await response.json();

                console.log(data);

                const articles =
                    data.news_results || [];

                document.getElementById("status")
                    .textContent =
                    `Found ${articles.length} articles`;

                const news =
                    document.getElementById("news");


                articles.forEach(article => {

                    news.innerHTML += `

                        <div class="article">

                            ${
                                article.thumbnail
                                ? `
                                    <img
                                        src="${article.thumbnail}"
                                        alt="${article.title}"
                                    >
                                `
                                : ""
                            }

                            <h2>
                                ${article.title}
                            </h2>

                            <p>
                                ${article.source || ""}
                            </p>

                            <p>
                                ${article.date || ""}
                            </p>

                            <p>
                                ${article.snippet || ""}
                            </p>

                            <a
                                href="${article.link}"
                                target="_blank"
                            >
                                Read article
                            </a>

                        </div>

                    `;

                });


            } catch (error) {

                document.getElementById("status")
                    .textContent =
                    "Error: " + error.message;

            }

        }

        getNews();

    </script>

</body>

</html>
