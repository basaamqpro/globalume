<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Globalume News Test</title>
</head>

<body>

    <h1>Hello Globalume 👋</h1>

    <p id="status">
        Loading news...
    </p>

    <div id="news"></div>


    <script>

        async function getNews() {

            try {

                const response = await fetch("/api/news");

                const data = await response.json();

                console.log(data);

                const articles =
                    data.news_results || [];


                document.getElementById("status")
                    .textContent =
                    `Received ${articles.length} articles`;


                const news =
                    document.getElementById("news");


                articles.forEach(article => {

                    news.innerHTML += `
                        <hr>

                        <h2>
                            ${article.title}
                        </h2>

                        <p>
                            ${article.source?.name || ""}
                        </p>

                        <a
                            href="${article.link}"
                            target="_blank"
                        >
                            Read article
                        </a>
                    `;

                });

            } catch (error) {

                document.getElementById("status")
                    .textContent =
                    "Error: " + error.message;

            }

        }


        getNews();

    </script>

</body>

</html>
